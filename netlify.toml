# Netlify конфигурация для QuestFlow PWA
[build]
  publish = "."

# ─── Безопасность — все страницы ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: single-file PWA с inline JS/CSS + Firebase + Pollinations + Worker
    Content-Security-Policy = """default-src 'self'; \
script-src 'self' 'unsafe-inline' https://www.gstatic.com; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob: https://image.pollinations.ai https://lh3.googleusercontent.com https:; \
font-src 'self'; \
connect-src 'self' \
  https://questflow-api.ravvichh.workers.dev \
  https://api.anthropic.com \
  https://api.open-meteo.com \
  https://image.pollinations.ai \
  https://*.googleapis.com \
  https://*.firebaseio.com \
  https://firebaseinstallations.googleapis.com \
  https://securetoken.googleapis.com \
  https://identitytoolkit.googleapis.com; \
frame-src https://accounts.google.com https://questflow-914eb.firebaseapp.com; \
object-src 'none'; \
base-uri 'self'; \
manifest-src 'self'; \
worker-src 'self'"""

# ─── Service Worker — никогда не кэшируется браузером ────────────────────────
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# ─── Manifest — правильный MIME, короткий кэш ────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# ─── Статика — кэшируем на год (immutable) ───────────────────────────────────
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
